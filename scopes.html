<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scopes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1><a href="task-dashboard.html" class="brand-link">My Tasks</a></h1>
    <div class="app-header-right">
      <nav class="app-nav">
        <a href="task-dashboard.html">Dashboard</a>
        <a href="task-ranker.html">Ranker</a>
        <a href="task-ranker2.html">Drag Ranker</a>
        <a href="loop-dashboard.html">Loops</a>
        <a href="scopes.html" class="active">Scopes</a>
      </nav>
      <div class="auth-status">
        <span id="current-user-name"></span>
        <button class="btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <label style="font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="show-deleted" /> Show deleted
      </label>
      <button class="btn btn-primary" id="add-scope-btn">+ Add scope</button>
    </div>

    <div id="scope-list" class="scope-list"></div>
    <div id="empty-state" class="empty-state" hidden>No scopes yet. Add your first one.</div>
  </main>

  <dialog id="rename-dialog" class="confirm-dialog">
    <p style="margin-bottom:8px;">Rename scope</p>
    <div class="field" style="margin-bottom:18px;">
      <input type="text" id="rename-input" />
    </div>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn" id="rename-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="rename-save">Save</button>
    </div>
  </dialog>

  <dialog id="add-scope-dialog" class="confirm-dialog">
    <p style="margin-bottom:8px;">New scope</p>
    <div class="field" style="margin-bottom:18px;">
      <input type="text" id="add-scope-input" placeholder="Scope name" />
    </div>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn" id="add-scope-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="add-scope-save">Add</button>
    </div>
  </dialog>

  <template id="scope-row-template">
    <div class="scope-row" data-row draggable="true">
      <span class="drag-handle">&#x28FF;</span>
      <input type="checkbox" data-field="is-active" title="Active" aria-label="Active" />
      <span class="scope-name" data-field="name"></span>
      <div class="scope-menu">
        <button type="button" class="btn-ghost btn-icon" data-menu-toggle title="More actions" aria-label="More actions">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="1.8" />
            <circle cx="12" cy="12" r="1.8" />
            <circle cx="12" cy="19" r="1.8" />
          </svg>
        </button>
        <div class="scope-menu-dropdown" data-menu-dropdown hidden>
          <button type="button" data-action="rename">Rename</button>
          <button type="button" data-action="delete" data-menu-item="delete">Delete</button>
          <button type="button" data-action="restore" data-menu-item="restore">Restore</button>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scopes.js"></script>
</body>
</html>
