<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1><a href="task-dashboard.html" class="brand-link">My Tasks</a></h1>
    <div class="app-header-right">
      <nav class="app-nav">
        <a href="task-dashboard.html" class="active">Dashboard</a>
        <a href="task-ranker.html">Ranker</a>
        <a href="task-ranker2.html">Drag Ranker</a>
        <a href="loop-dashboard.html">Loops</a>
        <a href="scopes.html">Scopes</a>
      </nav>
      <div class="auth-status">
        <span id="current-user-name"></span>
        <button class="btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <label style="font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="show-done" /> Show completed
      </label>
      <button class="btn btn-primary" id="add-task-btn">+ Add Task</button>
    </div>

    <table class="rankings-table" id="tasks-table">
      <thead>
        <tr>
          <th class="sortable" data-sort="name">Name</th>
          <th class="sortable" data-sort="dueDate">Due Date</th>
          <th class="sortable" data-sort="rewardScore">Reward</th>
          <th class="sortable" data-sort="consequenceScore">Consequence</th>
          <th class="sortable" data-sort="urgencyScore">Urgency</th>
          <th class="sortable" data-sort="totalScore">Total</th>
        </tr>
      </thead>
      <tbody id="task-tbody"></tbody>
    </table>
    <div id="empty-state" class="empty-state" hidden>No tasks yet. Add your first one.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/db.js"></script>
  <script src="js/task-dashboard.js"></script>
</body>
</html>
