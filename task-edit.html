<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Task</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Edit Task</h1>
    <nav class="app-nav">
      <a href="task-dashboard.html">Dashboard</a>
      <a href="task-ranker.html">Ranker</a>
    </nav>
  </header>

  <main>
    <a id="back-link" class="btn" href="task-dashboard.html" style="display:inline-block; margin-bottom:14px;">&larr; Back</a>
    <div id="save-banner" class="status-banner" style="margin-bottom:14px;" hidden>Saved</div>

    <form class="task-form" id="task-form">
      <div class="field">
        <label for="name">Task name</label>
        <input type="text" id="name" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="due-date">Due date</label>
          <input type="datetime-local" id="due-date" />
        </div>
        <div class="field">
          <label for="done-checkbox">Status</label>
          <label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:14px; color:var(--text);">
            <input type="checkbox" id="done-checkbox" /> Marked as done
          </label>
        </div>
      </div>

      <fieldset>
        <legend>Preparation needed</legend>
        <div class="field-row">
          <div class="field">
            <label for="prep-value">How far ahead (number)</label>
            <input type="number" id="prep-value" placeholder="e.g. 14" />
          </div>
          <div class="field">
            <label for="prep-unit">Unit</label>
            <select id="prep-unit">
              <option value="hour">Hours</option>
              <option value="day" selected>Days</option>
              <option value="week">Weeks</option>
              <option value="month">Months</option>
            </select>
          </div>
        </div>
        <div id="prep-preview" style="font-size:13px; color:var(--text-muted);"></div>
        <button type="button" class="btn" id="add-prep-reminder" style="margin-top:10px;">+ Add reminder at prep time</button>
      </fieldset>

      <fieldset>
        <legend>Reminders</legend>
        <div id="reminders-list"></div>
        <button type="button" class="btn" id="add-reminder">+ Add reminder</button>
      </fieldset>

      <fieldset>
        <legend>Rewards vs. Consequences</legend>
        <table class="rewards-consequences-table">
          <thead>
            <tr>
              <th>Rewards (of doing this task)</th>
              <th>Consequences (of not doing this task)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div id="rewards-list"></div>
                <button type="button" class="btn" id="add-reward">+ Add reward</button>
              </td>
              <td>
                <div id="consequences-list"></div>
                <button type="button" class="btn" id="add-consequence">+ Add consequence</button>
              </td>
            </tr>
          </tbody>
        </table>
      </fieldset>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-danger" id="delete-btn">Delete task</button>
        <div class="right">
          <a id="cancel-link" class="btn" href="task-dashboard.html">Cancel</a>
          <button type="submit" class="btn btn-primary">Save task</button>
        </div>
      </div>
    </form>
  </main>

  <template id="reminder-row-template">
    <div class="repeat-row" data-row>
      <input type="datetime-local" data-field="reminder" />
      <button type="button" class="btn-ghost btn-icon" data-remove title="Remove" aria-label="Remove">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18" />
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
          <path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </button>
    </div>
  </template>

  <template id="reward-row-template">
    <div class="repeat-row" data-row>
      <select data-field="type">
        <option value="financial">Financial</option>
        <option value="other">Other</option>
      </select>
      <input type="text" data-field="value" placeholder="e.g. 50.00 or 'A day off'" />
      <button type="button" class="btn-ghost btn-icon" data-remove title="Remove" aria-label="Remove">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18" />
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
          <path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </button>
    </div>
  </template>

  <template id="consequence-row-template">
    <div class="repeat-row" data-row>
      <select data-field="type">
        <option value="financial">Financial</option>
        <option value="other">Other</option>
      </select>
      <input type="text" data-field="value" placeholder="e.g. 'Lose 20.00 deposit' or 'Miss the deadline'" />
      <button type="button" class="btn-ghost btn-icon" data-remove title="Remove" aria-label="Remove">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18" />
          <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
          <path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </button>
    </div>
  </template>

  <script src="js/dates.js"></script>
  <script src="js/db.js"></script>
  <script src="js/task-edit.js"></script>
</body>
</html>
