<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>My Tasks</h1>
  </header>

  <main class="auth-main">
    <form class="task-form auth-form" id="login-form">
      <h2 id="auth-heading" style="margin:0;">Log in</h2>
      <div id="auth-error" class="status-banner status-banner-error" hidden></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6" />
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="toggle-mode-btn">Need an account? Sign up</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Log in</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
