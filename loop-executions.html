<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loop Executions</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1><a href="task-dashboard.html" class="brand-link">My Tasks</a></h1>
    <div class="app-header-right">
      <nav class="app-nav">
        <a href="task-dashboard.html">Dashboard</a>
        <a href="task-ranker.html">Ranker</a>
        <a href="task-ranker2.html">Drag Ranker</a>
        <a href="loop-dashboard.html" class="active">Loops</a>
        <a href="scopes.html">Scopes</a>
      </nav>
      <div class="auth-status">
        <span id="current-user-name"></span>
        <button class="btn" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <a class="btn" href="loop-dashboard.html" style="display:inline-block; margin-bottom:14px;">&larr; Back to Loops</a>

    <div class="loop-header">
      <div class="field">
        <label for="loop-name">Loop name</label>
        <input type="text" id="loop-name" placeholder="New Loop" />
      </div>
      <div class="field">
        <label for="loop-notes">Loop notes</label>
        <textarea id="loop-notes" placeholder="Notes about this loop..."></textarea>
      </div>
      <div class="field">
        <label for="loop-scope">Scope</label>
        <select id="loop-scope">
          <option value="">(No scope)</option>
        </select>
      </div>
      <div class="row-actions">
        <button class="btn btn-danger" id="delete-loop-btn">Delete loop</button>
      </div>
    </div>

    <div class="loop-columns">
      <div class="loop-col loop-col-list">
        <div class="loop-col-header">
          <h3>Executions</h3>
          <button class="btn btn-primary" id="new-execution-btn">+ Log New</button>
        </div>
        <div id="executions-list" class="exec-list"></div>
        <div id="executions-empty" class="task-detail-empty" hidden>No executions logged yet.</div>
      </div>

      <div class="loop-col loop-col-detail">
        <div id="no-selection" class="task-detail-empty">Select an execution on the left, or log a new one.</div>
        <div id="execution-detail" hidden>
          <div class="exec-detail-header">
            <span id="exec-date-label" class="date-badge date-normal"></span>
            <button class="btn btn-danger" id="delete-exec-btn">Delete</button>
          </div>

          <div class="timer-panel">
            <div class="timer-info">
              <div class="timer-display" id="timer-display">0.00 h</div>
              <div class="timer-meta" id="timer-meta" hidden></div>
            </div>
            <button class="btn btn-primary" id="start-timer-btn">Start Timer</button>
            <button class="btn btn-danger" id="stop-timer-btn" hidden>Stop Timer</button>
          </div>

          <div class="field">
            <label for="exec-notes">Notes</label>
            <textarea id="exec-notes" placeholder="What happened this run..."></textarea>
          </div>

          <div class="field">
            <label for="exec-notes-next">Notes for next loop</label>
            <textarea id="exec-notes-next" placeholder="Anything to carry forward..."></textarea>
          </div>
        </div>
      </div>
    </div>
  </main>

  <dialog id="delete-exec-confirm-dialog" class="confirm-dialog">
    <p>Delete this execution? This cannot be undone.</p>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn" id="delete-exec-confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="delete-exec-confirm-ok">Delete</button>
    </div>
  </dialog>

  <dialog id="stop-timer-dialog" class="confirm-dialog">
    <p>Add this time to the execution's logged hours?</p>
    <div class="field">
      <label for="stop-timer-hours">Hours to add</label>
      <input type="number" id="stop-timer-hours" step="0.01" min="0" />
    </div>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn" id="stop-timer-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="stop-timer-confirm">Add Time</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/db.js"></script>
  <script src="js/scope-filter.js"></script>
  <script src="js/loop-executions.js"></script>
</body>
</html>
